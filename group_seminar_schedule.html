<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Seminar page moved</title>

    <!--
    Keep old bookmarks working after the seminar page moved. JavaScript uses
    replace() so the obsolete URL is not retained in the browser's Back stack;
    the refresh element provides a fallback when JavaScript is unavailable.
    -->
    <link rel="canonical" href="/seminar">
    <meta http-equiv="refresh" content="0; url=/seminar">
    <script>
      window.location.replace("/seminar");
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="/seminar">the seminar schedule</a>.</p>
  </body>
</html>
